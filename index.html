 train.innerHTML='<div class="pagehead"><div><div class="eyebrow">Tu plan de entrenamiento</div><h1>Entrenar</h1><p class="lede">Anota tus series y sigue el avance semana a semana.</p></div><div class="headnote">Se guarda automáticamente<br>en este dispositivo.</div></div><section class="cycle"><div class="cyclecopy"><strong>Semana '+week+' <span style="display:inline;color:var(--muted);font-weight:500">de '+state.weeksCount+'</span></strong><span>'+wt.n+' series anotadas esta semana</span></div><div class="cyclecontrols"><div class="weeks">'+weeks+'</div><div class="weekactions"><button class="weekaction" data-action="remove-week" type="button">− Eliminar semana</button><button class="weekaction" data-action="add-week" type="button">＋ Añadir semana</button></div></div></section><div class="days">'+days+'</div><div class="session"><div class="sessiontitle"><span class="mark">'+day+'</span><div><h2>Día '+day+'</h2><p>'+esc(names[day])+' · Semana '+week+'</p></div></div><div class="daycount"><strong>'+dt.n+' / '+dt.p+' series</strong>anotadas</div></div><div class="layout"><section><div class="list">'+cards+'</div><div class="actions"><span class="savehint">Guardado automáticamente en este móvil</span><button class="complete '+(done?"done":"")+'" id="completeDay">'+(done?"✓ Día completado":"Marcar día completado")+'</button></div></section><aside class="side"><div class="sidecard"><h3>Semana '+week+'</h3><div class="kpi"><strong>'+percent(wt.n,wt.p)+'%</strong><span>de las series<br>anotadas</span></div><div class="track"><div class="fill" style="width:'+percent(wt.n,wt.p)+'%"></div></div><div class="side-small"><span>'+wt.n+' anotadas</span><span>'+wt.p+' previstas</span></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0">'+Array.from({length:5},function(_,i){let d=i+1,t=statsDay(week,d);return'<div class="mini"><span>Día '+d+' · '+esc(names[d])+'</span><strong>'+t.n+'/'+t.p+'</strong></div>'}).join("")+'</div><div class="sidecard sideinfo"><b>Cómo usarlo</b><br>Abre cada ejercicio, registra kg y repeticiones por serie. Las series opcionales aparecen señaladas; las notas se guardan junto a cada serie.</div></aside></div>';
}
function renderRoutine(){
 const cards=Array.from({length:5},function(_,i){
  let d=i+1;
  const exerciseRows=ofDay(d).map(function(x){
   return '<div class="routine-ex"><div class="routine-ex-head"><div><strong>'+esc(x.name)+'</strong><div class="meta">'+esc(x.prescription)+'</div></div><button class="remove-ex" type="button" data-delete-id="'+x.id+'" data-delete-day="'+d+'">Eliminar</button></div>'+(x.note?'<p>'+esc(x.note)+'</p>':"")+'</div>'
  }).join("");
  return '<article class="routine-day"><div class="routine-head"><div><span>Día '+d+'</span><h2>'+esc(names[d])+'</h2></div><button class="start" data-start="'+d+'">Entrenar →</button></div>'+exerciseRows+'<div class="routine-actions"><button class="add-ex" type="button" data-add-day="'+d+'">＋ Añadir ejercicio</button></div></article>'
 }).join("");
 routinePage.innerHTML='<div class="pagehead"><div><div class="eyebrow">Plan de entrenamiento</div><h1>Rutina por día</h1><p class="lede">Añade ejercicios a cada día o elimina los que ya no uses.</p></div></div><div class="routine-grid">'+cards+'</div>'
}
function openExerciseModal(targetDay){addingDay=targetDay;document.getElementById("exerciseForm").reset();document.getElementById("exerciseSets").value="3";document.getElementById("exerciseModal").classList.add("open");setTimeout(function(){document.getElementById("exerciseName").focus()},50)}
function closeExerciseModal(){document.getElementById("exerciseModal").classList.remove("open")}
function deleteExercise(id,targetDay){
 const x=routine.find(function(item){return item.id===id&&item.day===targetDay});if(!x)return;
 const affected=Object.keys(state.entries).some(function(k){return Number(k.split("|")[2])===id});
 if(affected&&!confirm("Este ejercicio tiene registros guardados. Al eliminarlo también se borrarán. ¿Continuar?"))return;
 routine=routine.filter(function(item){return item.id!==id});Object.keys(state.entries).forEach(function(k){if(Number(k.split("|")[2])===id)delete state.entries[k]});
 save();renderAll();toast("Ejercicio eliminado")
}
function addExercise(event){
 event.preventDefault();const name=document.getElementById("exerciseName").value.trim(),sets=Math.max(1,Math.min(10,Number(document.getElementById("exerciseSets").value)||3)),target=document.getElementById("exerciseTarget").value.trim()||"Sin rango",note=document.getElementById("exerciseNote").value.trim();
 if(!name)return;const id=routine.reduce(function(max,item){return Math.max(max,Number(item.id)||0)},-1)+1;
 routine.push({id:id,day:addingDay,group:names[addingDay],name:name,note:note,prescription:target==="Sin rango"?sets+" · sin rango":sets+" × "+target,sets:sets,target:target,optionalLast:false,custom:true});
 save();closeExerciseModal();renderAll();toast("Ejercicio añadido al Día "+addingDay)
}
function renderProgress(){let all=statsAll(),cur=statsWeek(week);const bars=Array.from({length:state.weeksCount},function(_,i){let w=i+1,t=statsWeek(w);return'<div class="weekcol"><div class="barwrap"><div class="bar '+(w===week?"current":"")+'" style="height:'+Math.max(3,percent(t.n,t.p))+'%"><span class="barval">'+t.n+'</span></div></div><span class="weeklabel">S'+w+'</span></div>'}).join("");const breakdown=Array.from({length:5},function(_,i){let d=i+1,t=statsDay(week,d);return'<div class="break"><span>Día '+d+'</span><strong>'+t.n+'<small> / '+t.p+'</small></strong><small>'+esc(names[d])+'</small></div>'}).join("");
 const history=routine.map(function(x){let first=null,last=null;for(let w=1;w<=state.weeksCount;w++)for(let s=1;s<=x.sets;s++){let e=get(w,x.day,x.id,s);if(String(e.weight||"").trim()){let r={weight:Number(e.weight)};if(!first)first=r;last=r}}if(!first)return"";let delta=last.weight-first.weight,change=delta?'<b> '+(delta>0?"+":"")+String(Number(delta.toFixed(1))).replace(".",",")+' kg</b>':"";return'<div class="historyrow"><div><strong>'+esc(x.name)+'</strong><span>Día '+x.day+' · '+esc(names[x.day])+'</span></div><div class="historyvalue"><span>'+first.weight+' kg → '+last.weight+' kg</span>'+change+'</div></div>'}).filter(Boolean).join("");
 progressPage.innerHTML='<div class="pagehead"><div><div class="eyebrow">Resumen del ciclo</div><h1>Progreso</h1><p class="lede">Series anotadas y cargas registradas durante '+state.weeksCount+' semanas.</p></div></div><div class="stats"><div class="stat"><span>Series anotadas</span><strong>'+all.n+' <small style="font-size:12px;font-weight:500">/ '+all.p+'</small></strong><small>en todo el ciclo</small></div><div class="stat"><span>Semana seleccionada</span><strong>'+cur.n+' <small style="font-size:12px;font-weight:500">/ '+cur.p+'</small></strong><small>Semana '+week+' · '+percent(cur.n,cur.p)+'% de series</small></div></div><section class="chart"><div class="charttitle"><h2>Actividad por semana</h2><span>Series anotadas</span></div><div class="bars">'+bars+'</div><div class="breakdown">'+breakdown+'</div></section><section class="chart"><div class="charttitle"><h2>Historial de cargas</h2><span>Primera a última carga</span></div><div class="history">'+(history||'<div class="empty">Al registrar una carga, aparecerá aquí la evolución por ejercicio.</div>')+'</div></section><section class="chart"><div class="charttitle"><h2>Tus datos</h2><span>Guardados localmente</span></div><div class="note-box">Los registros quedan en el almacenamiento local de este navegador y dispositivo. Para cambiar de móvil, descarga una copia y restáurala en el otro. No se envían a ningún servidor.</div><div class="tools"><button class="quiet" id="exportJson">Descargar copia JSON</button><button class="quiet" id="exportCsv">Exportar a CSV</button><button class="quiet" id="importJson">Restaurar copia</button><button class="quiet danger" id="clearData">Borrar registros</button></div></section>'}
function renderAll(){renderTraining();renderRoutine();renderProgress()}
function addWeek(){state.weeksCount++;week=state.weeksCount;save();renderAll();toast("Semana "+week+" añadida")}
function removeWeek(){
 if(state.weeksCount<=1){toast("Debe quedar al menos una semana");return}
 const removed=week;
 const hasData=Object.keys(state.entries).some(function(k){return Number(k.split("|")[0])===removed})||Object.keys(state.completed).some(function(k){return Number(k.split("|")[0])===removed});
 if(hasData&&!confirm("La semana "+removed+" tiene registros. Al eliminarla se borrarán y las semanas posteriores se renumerarán. ¿Continuar?"))return;
 const nextEntries={};Object.keys(state.entries).forEach(function(k){let parts=k.split("|"),w=Number(parts[0]);if(w===removed)return;if(w>removed)parts[0]=String(w-1);nextEntries[parts.join("|")]=state.entries[k]});
 const nextCompleted={};Object.keys(state.completed).forEach(function(k){let parts=k.split("|"),w=Number(parts[0]);if(w===removed)return;if(w>removed)parts[0]=String(w-1);nextCompleted[parts.join("|")]=state.completed[k]});
 state.entries=nextEntries;state.completed=nextCompleted;state.weeksCount--;week=Math.min(removed,state.weeksCount);save();renderAll();toast("Semana eliminada")
}
function refresh(){let dt=statsDay(week,day),wt=statsWeek(week),dc=document.querySelector(".daycount"),cc=document.querySelector(".cyclecopy span"),kp=document.querySelector(".kpi strong"),fill=document.querySelector(".side .fill"),ss=document.querySelector(".side-small");if(dc)dc.innerHTML="<strong>"+dt.n+" / "+dt.p+" series</strong>anotadas";if(cc)cc.textContent=wt.n+" series anotadas esta semana";if(kp)kp.textContent=percent(wt.n,wt.p)+"%";if(fill)fill.style.width=percent(wt.n,wt.p)+"%";if(ss)ss.innerHTML="<span>"+wt.n+" anotadas</span><span>"+wt.p+" previstas</span>";document.querySelectorAll("[data-ex]").forEach(function(el){let id=Number(el.dataset.ex),x=routine.find(function(a){return a.id===id}),n=0;for(let s=1;s<=x.sets;s++)if(isLogged(get(week,day,id,s)))n++;el.textContent=n+"/"+x.sets;el.classList.toggle("complete",n===x.sets)});document.querySelectorAll(".week").forEach(function(el){el.classList.toggle("has",statsWeek(Number(el.dataset.week)).n>0)});document.querySelectorAll(".day").forEach(function(el){let t=statsDay(week,Number(el.dataset.day)),dot=el.querySelector(".dot");if(t.n&&!dot){dot=document.createElement("i");dot.className="dot";el.appendChild(dot)}if(!t.n&&dot)dot.remove()})}
function download(name,content,type){let blob=new Blob([content],{type:type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function exportCsv(){let rows=[["Semana","Día","Grupo","Ejercicio","Serie","Carga (kg)","Repeticiones","Notas"]];for(let w=1;w<=state.weeksCount;w++)for(let d=1;d<=5;d++)ofDay(d).forEach(function(x){for(let s=1;s<=x.sets;s++){let e=get(w,d,x.id,s);if(hasAny(e))rows.push([w,d,names[d],x.name,s,e.weight||"",e.reps||"",e.note||""])}});download("rutina-seguimiento.csv","\ufeff"+rows.map(function(r){return r.map(function(v){return'"'+String(v).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n"),"text/csv;charset=utf-8");toast("CSV descargado")}
function importFile(file){let reader=new FileReader();reader.onload=function(){try{let p=JSON.parse(reader.result);if(!p||p.version!==1||!p.entries||typeof p.entries!=="object")throw 0;if(!confirm("¿Restaurar esta copia? Los registros actuales se sustituirán."))return;state=Object.assign(blank(),p);routine=Array.isArray(p.routine)?p.routine:baseRoutine.map(function(x){return Object.assign({},x)});state.routine=routine;state.weeksCount=Math.max(1,Number(state.weeksCount)||8);week=Math.min(week,state.weeksCount);save();renderAll();toast("Copia restaurada")}catch(e){toast("No se pudo leer la copia JSON")}};reader.readAsText(file)}
train.addEventListener("click",function(e){let w=e.target.closest(".week"),d=e.target.closest(".day");if(w){week=Number(w.dataset.week);renderTraining()}else if(d){day=Number(d.dataset.day);renderTraining()}else if(e.target.closest("#completeDay")){let k=daykey(week,day);state.completed[k]=!state.completed[k];save();renderTraining();toast(state.completed[k]?"Día marcado como completado":"Marca quitada")}});
train.addEventListener("click",function(e){let b=e.target.closest("[data-action]");if(!b)return;if(b.dataset.action==="add-week")addWeek();else removeWeek()});
train.addEventListener("input",function(e){let x=e.target.closest("[data-field]");if(!x)return;let id=key(x.dataset.week,x.dataset.day,x.dataset.id,x.dataset.set),v=Object.assign({},state.entries[id]||{});v[x.dataset.field]=x.value;if(!v.weight&&!v.reps&&!v.note)delete state.entries[id];else state.entries[id]=v;save();refresh()});
routinePage.addEventListener("click",function(e){let del=e.target.closest("[data-delete-id]");if(del){deleteExercise(Number(del.dataset.deleteId),Number(del.dataset.deleteDay));return}let add=e.target.closest("[data-add-day]");if(add){openExerciseModal(Number(add.dataset.addDay));return}let b=e.target.closest("[data-start]");if(b){day=Number(b.dataset.start);switchView("training");renderTraining()}});document.getElementById("exerciseForm").addEventListener("submit",addExercise);document.getElementById("cancelExercise").addEventListener("click",closeExerciseModal);document.getElementById("exerciseModal").addEventListener("click",function(e){if(e.target.id==="exerciseModal")closeExerciseModal()});
progressPage.addEventListener("click",function(e){if(e.target.closest("#exportJson")){download("copia-rutina-seguimiento.json",JSON.stringify(state,null,2),"application/json");toast("Copia JSON descargada")}if(e.target.closest("#exportCsv"))exportCsv();if(e.target.closest("#importJson"))document.getElementById("importFile").click();if(e.target.closest("#clearData")&&confirm("¿Borrar todos los registros y marcas de días completados? Esta acción no se puede deshacer.")){let count=state.weeksCount;state=blank();state.weeksCount=count;state.routine=routine;week=Math.min(week,count);save();renderAll();toast("Registros borrados")}});
document.getElementById("importFile").addEventListener("change",function(e){if(e.target.files&&e.target.files[0])importFile(e.target.files[0]);e.target.value=""});
document.querySelectorAll(".navbtn").forEach(function(b){b.addEventListener("click",function(){switchView(b.dataset.view)})});
const modal=document.getElementById("installModal");document.getElementById("closeInstall").addEventListener("click",function(){modal.classList.remove("open")});modal.addEventListener("click",function(e){if(e.target===modal)modal.classList.remove("open")});
document.getElementById("installBtn").addEventListener("click",function(){if(deferred){deferred.prompt();deferred.userChoice.then(function(){deferred=null});return}let apple=/iPhone|iPad|iPod/i.test(navigator.userAgent);document.getElementById("installInstructions").innerHTML=apple?'<p>En Safari, toca <strong>Compartir</strong> y elige <strong>Añadir a pantalla de inicio</strong>.</p><p>Necesita una dirección HTTPS para instalarse y funcionar sin conexión.</p>':'<p>En Chrome, abre el menú <strong>⋮</strong> y elige <strong>Instalar aplicación</strong> o <strong>Añadir a pantalla de inicio</strong>.</p><p>Necesita una dirección HTTPS para instalarse y funcionar sin conexión.</p>';modal.classList.add("open")});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e});window.addEventListener("appinstalled",function(){toast("App añadida a la pantalla de inicio")});if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
renderAll();
</script></body></html>
